<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1440 900" fill="none">
  <!-- Pearl Off-White Canvas -->
  <rect width="1440" height="900" fill="#f8fafc"/>
  
  <!-- High-End Precision Architecture Grid -->
  <pattern id="luxLightGrid" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#e2e8f0" stroke-width="0.8"/>
    <!-- Alignment Crosshairs (+) at Grid Nodes -->
    <path d="M 76 80 H 84 M 80 76 V 84" stroke="#cbd5e1" stroke-width="1.2"/>
  </pattern>
  
  <rect width="1440" height="900" fill="url(#luxLightGrid)" opacity="0.6"/>

  <!-- Radial Vignette Overlay to Soften Edges -->
  <rect width="1440" height="900" fill="url(#lightVignette)"/>

  <!-- Luxurious Aurora Silk Light Waves (Blurred Glowing Mesh) -->
  <g filter="blur(80px)" opacity="0.55">
    <!-- Sapphire Blue Glow -->
    <ellipse cx="1100" cy="200" rx="450" ry="280" fill="url(#luxBlueGlow)" />
    <!-- Royal Indigo & Violet Core -->
    <ellipse cx="400" cy="650" rx="400" ry="260" fill="url(#luxIndigoGlow)" />
    <!-- Golden Amber Accent -->
    <ellipse cx="850" cy="450" rx="300" ry="180" fill="url(#luxAmberGlow)" opacity="0.35" />
  </g>

  <!-- Elegant Silk Light Ribbons (3D Flow Curves) -->
  <g opacity="0.45">
    <path d="M-100 250 Q 350 50, 750 350 T 1540 180" stroke="url(#luxRibbon1)" stroke-width="2.5" fill="none"/>
    <path d="M-100 380 Q 450 180, 850 480 T 1540 300" stroke="url(#luxRibbon2)" stroke-width="1.8" fill="none"/>
    <path d="M-100 180 Q 550 450, 950 150 T 1540 420" stroke="url(#luxRibbon1)" stroke-width="1.2" stroke-dasharray="8 8" fill="none"/>
  </g>

  <!-- Precision Floating Light Nodes -->
  <g opacity="0.6">
    <circle cx="750" cy="350" r="3" fill="#2563eb" />
    <circle cx="750" cy="350" r="8" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    
    <circle cx="450" cy="180" r="2.5" fill="#4f46e5" />
    <circle cx="1150" cy="480" r="3" fill="#0284c7" />
  </g>

  <defs>
    <radialGradient id="lightVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0"/>
      <stop offset="70%" stop-color="#f8fafc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.85"/>
    </radialGradient>

    <linearGradient id="luxBlueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="luxIndigoGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="luxAmberGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="luxRibbon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="luxRibbon2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
