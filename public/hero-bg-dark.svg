<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1440 900" fill="none">
  <!-- Deep Obsidian Dark Canvas -->
  <rect width="1440" height="900" fill="#030712"/>
  
  <!-- High-End Precision Dark Architecture Grid -->
  <pattern id="luxDarkGrid" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    <!-- Alignment Crosshairs (+) at Grid Nodes -->
    <path d="M 76 80 H 84 M 80 76 V 84" stroke="#334155" stroke-width="1.2"/>
  </pattern>
  
  <rect width="1440" height="900" fill="url(#luxDarkGrid)" opacity="0.6"/>

  <!-- Radial Vignette Overlay to Soften Edges -->
  <rect width="1440" height="900" fill="url(#darkVignette)"/>

  <!-- Luxurious Dark Aurora Silk Light Mesh -->
  <g filter="blur(90px)" opacity="0.5">
    <!-- Deep Sapphire Glow -->
    <ellipse cx="1100" cy="200" rx="480" ry="300" fill="url(#darkLuxBlueGlow)" />
    <!-- Royal Midnight Indigo Core -->
    <ellipse cx="380" cy="680" rx="420" ry="280" fill="url(#darkLuxIndigoGlow)" />
    <!-- Cyber Cyan Accent -->
    <ellipse cx="850" cy="450" rx="320" ry="190" fill="url(#darkLuxCyanGlow)" opacity="0.4" />
  </g>

  <!-- Elegant Silk Light Ribbons (3D Flow Curves) -->
  <g opacity="0.4">
    <path d="M-100 250 Q 350 50, 750 350 T 1540 180" stroke="url(#darkLuxRibbon1)" stroke-width="2.5" fill="none"/>
    <path d="M-100 380 Q 450 180, 850 480 T 1540 300" stroke="url(#darkLuxRibbon2)" stroke-width="1.8" fill="none"/>
    <path d="M-100 180 Q 550 450, 950 150 T 1540 420" stroke="url(#darkLuxRibbon1)" stroke-width="1.2" stroke-dasharray="8 8" fill="none"/>
  </g>

  <!-- Precision Floating Glowing Light Nodes -->
  <g opacity="0.7">
    <circle cx="750" cy="350" r="3" fill="#60a5fa" />
    <circle cx="750" cy="350" r="10" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
    
    <circle cx="450" cy="180" r="2.5" fill="#818cf8" />
    <circle cx="1150" cy="480" r="3" fill="#38bdf8" />
  </g>

  <defs>
    <radialGradient id="darkVignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#030712" stop-opacity="0"/>
      <stop offset="70%" stop-color="#030712" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </radialGradient>

    <linearGradient id="darkLuxBlueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="darkLuxIndigoGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="darkLuxCyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="darkLuxRibbon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#a5b4fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="darkLuxRibbon2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
